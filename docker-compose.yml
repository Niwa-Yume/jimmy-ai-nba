services:
  db:
    image: postgres:15-alpine
    container_name: jimmy_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      # Persistance des données (pour ne pas tout perdre au redémarrage)
      - postgres_data:/var/lib/postgresql/data
      # Script d'init (exécuté uniquement au premier lancement)
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jimmy_backend
    restart: always
    env_file: .env
    volumes:
      - ./.env:/app/.env:ro
      - ./backend:/app/backend
      - ./data-pipeline:/app/data-pipeline
      - ./scripts/check_data_health.py:/app/check_data_health.py
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: jimmy_frontend
    restart: always
    env_file: .env
    environment:
      DOCKER_ENV: "true"
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  caddy:
    image: caddy:2.7
    container_name: jimmy_caddy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
